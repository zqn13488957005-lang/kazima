name: Install Hachi assistant
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Hachi script into index
        shell: bash
        run: |
          if ! grep -q 'hachi-assistant.js' index.html; then
            python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); p.write_text(s.replace('</body>','<script src=\"hachi-assistant.js\"></script></body>'),encoding='utf-8')"
          fi
      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Hachi assistant to LinguaReader'
          git push
