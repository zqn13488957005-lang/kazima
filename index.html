<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinguaReader 多语言阅读器</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#1f2937}.app{display:flex;height:100vh}.sidebar{width:260px;background:#fff;border-right:1px solid #e5e7eb;padding:18px;overflow:auto}.main{flex:1;display:flex;flex-direction:column;min-width:0}.header,.toolbar,.dialogue-panel{background:#fff;border-bottom:1px solid #e5e7eb}.header{padding:14px 20px;display:flex;justify-content:space-between}.header h1{margin:0;font-size:20px}.toolbar{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap}.toolbar button,.toolbar select,.dialogue-panel select{padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;background:#fff;cursor:pointer}.brand{font-size:22px;font-weight:800;margin-bottom:18px}.upload{display:block;background:#2563eb;color:#fff;text-align:center;padding:11px;border-radius:9px;cursor:pointer}.upload input{display:none}.file-item{padding:9px;border-radius:8px;cursor:pointer}.file-item:hover,.file-item.active{background:#eef2ff}.library{margin-top:20px}.library h3{font-size:14px}.library button{display:block;width:100%;margin:5px 0;padding:8px;text-align:left;border:1px solid #e5e7eb;background:transparent;border-radius:7px;cursor:pointer}.reader-wrap{flex:1;overflow:auto;background:#fff;padding:35px}.reader{max-width:900px;margin:auto;font-size:18px;line-height:1.9}.reader p{margin:0 0 14px}.status{padding:7px 16px;background:#f3f4f6;color:#6b7280;font-size:13px}.selection-toolbar{position:fixed;display:none;background:#111827;color:#fff;border-radius:8px;padding:6px;z-index:20}.selection-toolbar button{background:transparent;color:#fff;border:0;padding:6px;cursor:pointer}.dialogue-panel{display:none;padding:12px 16px}.dialogue-panel.show{display:block}.dialogue-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dialogue-progress{margin-top:8px;color:#6b7280;font-size:13px}.dark{background:#111827;color:#e5e7eb}.dark .sidebar,.dark .header,.dark .toolbar,.dark .dialogue-panel,.dark .reader-wrap{background:#1f2937;border-color:#374151}.dark .toolbar button,.dark .toolbar select,.dark .dialogue-panel select{background:#111827;color:#e5e7eb;border-color:#4b5563}.dark .status{background:#111827}.dark .file-item:hover,.dark .file-item.active{background:#374151}@media(max-width:700px){.sidebar{width:190px}.reader-wrap{padding:20px}.reader{font-size:16px}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script></head>
<body><div class="app"><aside class="sidebar"><div class="brand">📖 LinguaReader</div><label class="upload">＋ 上传文档<input id="fileInput" type="file" accept=".txt,.html,.htm,.pdf,.docx"></label><div id="fileList"></div><div class="library"><h3>日常对话</h3><div id="library"></div></div></aside><section class="main"><header class="header"><h1 id="title">请选择一个文档开始阅读</h1><button id="darkToggle">🌙</button></header><div class="toolbar"><button id="readSelection">🔊 朗读选中</button><button id="pauseBtn">⏸ 暂停</button><button id="resumeBtn">▶ 继续</button><button id="stopBtn">⏹ 停止</button><select id="langSelect"><option value="auto">自动识别</option><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select><select id="speedSelect"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select><button id="zoomOut">A−</button><button id="zoomIn">A＋</button><button id="dialogueToggle">💬 对话朗读</button></div><div class="dialogue-panel" id="dialoguePanel"><div class="dialogue-row"><b>男声：</b><select id="maleVoice"></select><button id="testMale">测试</button><b>女声：</b><select id="femaleVoice"></select><button id="testFemale">测试</button><button id="startDialogue">▶ 开始对话朗读</button></div><div class="dialogue-progress" id="dialogueProgress">支持 A/B、男/女、Male/Female、M/F 格式，不朗读角色标签。</div></div><div class="reader-wrap"><article class="reader" id="reader"><p>上传 TXT、HTML、PDF 或 DOCX 文件后，内容会显示在这里。鼠标选中文字即可朗读或复制。</p></article></div><div class="status" id="status">就绪</div></section></div><div class="selection-toolbar" id="selectionToolbar"><button id="selectionSpeak">🔊 朗读</button><button id="selectionCopy">📋 复制</button></div>
<script>
const $=id=>document.getElementById(id),reader=$('reader'),status=$('status');let currentText='',currentFile='',zoom=18,voices=[],dialogueLines=[],dialogueIndex=0;
function detectLang(t){if(/[가-힣]/.test(t))return'ko';if(/[ぁ-んァ-ヶ]/.test(t))return'ja';if(/[\u4e00-\u9fff]/.test(t))return'zh';return'en'}const langMap={zh:'zh-CN',en:'en-US',ja:'ja-JP',ko:'ko-KR'};
function convertHanja(t,l){if(l!=='ko')return t;const m={'韓國':'한국','大韓民國':'대한민국','日本':'일본','中國':'중국','美國':'미국','學生':'학생','學校':'학교','電話':'전화','時間':'시간','食堂':'식당','朋友':'친구','旅行':'여행','公司':'회사'};for(const a in m)t=t.split(a).join(m[a]);return t}
function refreshVoices(){voices=speechSynthesis.getVoices();$('maleVoice').innerHTML='';$('femaleVoice').innerHTML='';voices.forEach(v=>{for(const id of ['maleVoice','femaleVoice']){const o=document.createElement('option');o.value=v.name;o.textContent=v.name+' — '+v.lang;$(id).appendChild(o)}});pickGender('maleVoice','male');pickGender('femaleVoice','female')}
function pickGender(id,g){const r=g==='male'?/male|david|alex|daniel|james|george|thomas|ryan/i:/female|samantha|zira|susan|kate|hazel|jenny|aria|sara/i;const v=voices.find(x=>r.test(x.name));if(v)$(id).value=v.name}
function voiceFor(name,lang,g){let v=voices.find(x=>x.name===name);if(v)return v;const list=voices.filter(x=>(x.lang||'').toLowerCase().startsWith(lang.split('-')[0]));const r=g==='male'?/male|david|alex|daniel|james|george|thomas|ryan/i:/female|samantha|zira|susan|kate|hazel|jenny|aria|sara/i;return list.find(x=>r.test(x.name))||list[0]||voices[0]}
function speak(text,lang='auto',gender=null){speechSynthesis.cancel();if(!text)return;const l=lang==='auto'?detectLang(text):lang,u=new SpeechSynthesisUtterance(convertHanja(text,l));u.lang=langMap[l];u.rate=+$('speedSelect').value;const v=gender?voiceFor(gender==='male'?$('maleVoice').value:$('femaleVoice').value,u.lang,gender):voiceFor('',u.lang);if(v)u.voice=v;u.pitch=gender==='female'?1.15:gender==='male'?.85:1;u.onstart=()=>status.textContent='正在朗读…';u.onend=()=>status.textContent='朗读完成';u.onerror=e=>status.textContent='朗读失败：'+e.error;speechSynthesis.speak(u)}
function parseDialogue(t){return t.split(/\r?\n/).map(x=>{const m=x.match(/^\s*(A|B|男|女|Male|Female|M|F)\s*[:：-]\s*(.+)$/i);if(!m)return null;const s=m[1].toLowerCase();return{gender:['a','男','male','m'].includes(s)?'male':'female',text:m[2]}}).filter(Boolean)}
function startDialogue(){const a=parseDialogue(reader.innerText||currentText);if(!a.length){status.textContent='未检测到对话格式，例如 A: Hello / B: Hi';return}dialogueLines=a;dialogueIndex=0;nextDialogue()}
function nextDialogue(){if(dialogueIndex>=dialogueLines.length){status.textContent='对话朗读完成';$('dialogueProgress').textContent='完成';return}const x=dialogueLines[dialogueIndex],l=detectLang(x.text);$('dialogueProgress').textContent=`${dialogueIndex+1} / ${dialogueLines.length} · ${x.gender==='male'?'男声':'女声'} · ${l}`;const u=new SpeechSynthesisUtterance(convertHanja(x.text,l));u.lang=langMap[l];u.rate=+$('speedSelect').value;const v=voiceFor(x.gender==='male'?$('maleVoice').value:$('femaleVoice').value,u.lang,x.gender);if(v)u.voice=v;u.pitch=x.gender==='male'?.85:1.15;u.onend=()=>{dialogueIndex++;setTimeout(nextDialogue,120)};u.onerror=()=>{dialogueIndex++;nextDialogue()};speechSynthesis.cancel();speechSynthesis.speak(u)}
$('fileInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;currentFile=f.name;$('title').textContent=f.name;status.textContent='正在读取…';let html='';if(/\.pdf$/i.test(f.name)){const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let pages=[];for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();pages.push(c.items.map(x=>x.str).join(' '))}currentText=pages.join('\n\n');html=currentText.split(/\n+/).map(x=>'<p>'+escapeHtml(x)+'</p>').join('')}else if(/\.docx$/i.test(f.name)){const r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()});html=r.value;currentText=readerText(html)}else if(/\.html?$/i.test(f.name)){html=await f.text();currentText=readerText(html)}else{currentText=await f.text();html=currentText.split(/\n+/).map(x=>'<p>'+escapeHtml(x)+'</p>').join('')}reader.innerHTML=html||'<p>文件没有可显示的文本。</p>';addFile(f.name);status.textContent='读取完成'});
function readerText(h){const d=document.createElement('div');d.innerHTML=h;return d.innerText}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function addFile(n){const d=document.createElement('div');d.className='file-item active';d.textContent=n;$('fileList').appendChild(d)}
function selected(){return String(getSelection()).trim()}$('readSelection').onclick=()=>speak(selected(),$('langSelect').value);$('selectionSpeak').onclick=()=>{speak(selected(),$('langSelect').value);$('selectionToolbar').style.display='none'};$('selectionCopy').onclick=async()=>{await navigator.clipboard.writeText(selected());$('selectionToolbar').style.display='none';status.textContent='已复制'};
document.addEventListener('selectionchange',()=>{const s=selected();if(!s){$('selectionToolbar').style.display='none';return}const r=getSelection().getRangeAt(0).getBoundingClientRect();$('selectionToolbar').style.left=(r.left+r.width/2-60)+'px';$('selectionToolbar').style.top=Math.max(8,r.top-48)+'px';$('selectionToolbar').style.display='flex'});
$('pauseBtn').onclick=()=>speechSynthesis.pause();$('resumeBtn').onclick=()=>speechSynthesis.resume();$('stopBtn').onclick=()=>{speechSynthesis.cancel();status.textContent='已停止'};$('zoomIn').onclick=()=>{zoom=Math.min(32,zoom+2);reader.style.fontSize=zoom+'px'};$('zoomOut').onclick=()=>{zoom=Math.max(12,zoom-2);reader.style.fontSize=zoom+'px'};$('darkToggle').onclick=()=>document.body.classList.toggle('dark');$('dialogueToggle').onclick=()=>$('dialoguePanel').classList.toggle('show');$('startDialogue').onclick=startDialogue;$('testMale').onclick=()=>speak('Hello, this is the male voice.','en','male');$('testFemale').onclick=()=>speak('Hello, this is the female voice.','en','female');document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();startDialogue()}});speechSynthesis.onvoiceschanged=refreshVoices;refreshVoices();
const demos=[['英语：便利店','A: Hi, do you have bottled water?\nB: Yes. It is in aisle three.\nA: Great, thank you.'],['日语：便利店','A: すみません、水はありますか？\nB: はい、三番通路です。\nA: ありがとうございます。'],['韩语：便利店','A: 안녕하세요. 생수 있어요?\nB: 네, 3번 통로에 있어요.\nA: 감사합니다.']];demos.forEach(([n,t])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{reader.innerHTML=t.split('\n').map(x=>'<p>'+escapeHtml(x)+'</p>').join('');currentText=t;$('title').textContent=n};$('library').appendChild(b)});
</script></body></html>
